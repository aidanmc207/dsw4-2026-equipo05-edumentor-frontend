<main class="pagina">
  <section class="panel">
    <p class="marca">EduMentor Hub</p>
    <h1>Iniciar sesión</h1>

    <form [formGroup]="formulario" (ngSubmit)="ingresar()" novalidate>
      <div class="campo">
        <label for="email">Correo</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="formulario.controls.email.touched && formulario.controls.email.invalid"
          [attr.aria-describedby]="
            formulario.controls.email.touched && formulario.controls.email.invalid ? 'email-error' : null
          "
        />
        @if (formulario.controls.email.touched && formulario.controls.email.invalid) {
          <p class="campo-error" id="email-error">Ingrese un correo válido.</p>
        }
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="formulario.controls.password.touched && formulario.controls.password.invalid"
          [attr.aria-describedby]="
            formulario.controls.password.touched && formulario.controls.password.invalid
              ? 'password-error'
              : null
          "
        />
        @if (formulario.controls.password.touched && formulario.controls.password.invalid) {
          <p class="campo-error" id="password-error">Ingrese la contraseña.</p>
        }
      </div>

      @if (error()) {
        <p class="alerta" role="alert">{{ error() }}</p>
      }

      <button type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </section>
</main>
