<main class="pagina">
  <section class="panel">
    <p class="marca">EduMentor Hub</p>
    <h1>{{ 'login.titulo' | translate }}</h1>

    <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <div class="campo">
        <label for="email">{{ 'login.correo' | translate }}</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          [attr.aria-describedby]="form.controls.email.touched && form.controls.email.invalid ? 'email-error' : null"
        />
        <p class="campo-error" id="email-error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          {{ 'login.errorCorreo' | translate }}
        </p>
      </div>

      <div class="campo">
        <label for="password">{{ 'login.contrasena' | translate }}</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
          [attr.aria-describedby]="
            form.controls.password.touched && form.controls.password.invalid ? 'password-error' : null
          "
        />
        <p
          class="campo-error"
          id="password-error"
          *ngIf="form.controls.password.touched && form.controls.password.invalid"
        >
          {{ 'login.errorContrasena' | translate }}
        </p>
      </div>

      <p class="alerta" role="alert" *ngIf="mensaje()">{{ mensaje() | translate }}</p>

      <button type="submit" [disabled]="enviando()">
        {{ (enviando() ? 'login.ingresando' : 'login.ingresar') | translate }}
      </button>
    </form>
  </section>
</main>
