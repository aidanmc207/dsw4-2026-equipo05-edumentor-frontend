<header class="barra">
  <a class="marca" routerLink="/inicio">EduMentor Hub</a>

  <nav [attr.aria-label]="'menu.principal' | translate">
    <ul>
      <li><a routerLink="/materias" routerLinkActive="activo">{{ 'menu.materias' | translate }}</a></li>
      <li *ngIf="rol() === 'TUTOR'">
        <a routerLink="/disponibilidad" routerLinkActive="activo">{{ 'menu.miDisponibilidad' | translate }}</a>
      </li>
    </ul>
  </nav>

  <div class="usuario">
    <span>{{ nombre() }}</span>
    <app-selector-idioma />
    <button type="button" (click)="salir()">{{ 'menu.cerrarSesion' | translate }}</button>
  </div>
</header>
